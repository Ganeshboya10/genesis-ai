services:
  - type: web
    name: genesis-ai
    runtime: python
    plan: free            # use "free" to test; free sleeps after 15 min idle
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_MODE
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: SHOPIFY_API_VERSION
        value: "2026-01"
      - key: SESSION_SECRET
        generateValue: true
      # Secrets: paste these in the Render dashboard (never commit them)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: CLARITY_API_TOKEN
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
