<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* HerVpod / Cool Comforts brand, taken from hervpod.com */
    --frost: #f8f3f6;          /* page: site's #f5f5f5 with a blush tint */
    --surface: #ffffff;
    --ink: #641f40;            /* brand plum (site text + headings) */
    --ink-soft: #8d6177;
    --line: #eedbe5;
    --glacier: #c24784;        /* brand rose (site footer / accents) */
    --glacier-strong: #832a54; /* site light-plum, for headings on white */
    --glacier-soft: #faecf3;   /* brand blush */
    --amber: #9a5a0c;
    --amber-soft: #fcf1e1;
    --alert: #d02e2e;          /* site promo red */
    --alert-soft: #fdecec;
    --radius-lg: 10px;
    --radius-sm: 6px;
    --radius-btn: 4px;         /* site buttons */
    --font-head: "Raleway", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-body: "Libre Baskerville", Georgia, serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --frost: #1b0e15;
      --surface: #26141e;
      --ink: #f7e7ef;
      --ink-soft: #c7a0b4;
      --line: #3e2331;
      --glacier: #f07bb5;
      --glacier-strong: #f5a3cb;
      --glacier-soft: #3a1c2b;
      --amber: #eaa850;
      --amber-soft: #2f2316;
      --alert: #f18a80;
      --alert-soft: #321a1a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--frost);
    color: var(--ink);
    font-family: var(--font-head);
    font-variant-numeric: lining-nums;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--glacier); outline-offset: 2px; }
  textarea:focus-visible { outline: none; }

  /* ---------- Layout ---------- */
  .shell {
    height: 100vh;
    display: grid;
    grid-template-columns: minmax(320px, 420px) 1fr;
    grid-template-rows: auto 1fr;
    max-width: 1280px;
    margin: 0 auto;
  }
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { height: 30px; width: auto; display: block; }
  .brand-name { font-weight: 600; font-size: 16px; letter-spacing: .5px; }
  .brand-sub { color: var(--ink); font-weight: 600; letter-spacing: .5px; font-size: 15px; padding-left: 10px; border-left: 1px solid var(--line); }
  .test-mode {
    font-size: 13px; color: var(--amber); background: var(--amber-soft);
    padding: 4px 10px; border-radius: 999px;
  }
  .test-mode[hidden], .brand-name[hidden], #signOut[hidden] { display: none; }
  .top-actions { display: flex; align-items: center; gap: 16px; }
  a.text-btn { text-decoration: none; font-size: 14px; }

  /* ---------- Brief panel ---------- */
  .brief {
    margin: 0 0 24px 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brief-head { padding: 22px 24px 4px; }
  .brief-kicker { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .brief-date {
    margin: 2px 0 0;
    font-size: 30px;
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: .3px;
  }
  .brief-body { padding: 8px 24px 8px; overflow-y: auto; flex: 1; font-family: var(--font-body); font-size: 13.5px; line-height: 1.7; }
  .brief-body h3 {
    font-family: var(--font-head); font-size: 14px; font-weight: 600; color: var(--glacier-strong);
    letter-spacing: .5px; margin: 18px 0 6px;
  }
  .brief-body ul { list-style: none; padding: 0; margin: 0; }
  .brief-body li { padding: 5px 0 5px 16px; position: relative; }
  .brief-body li::before {
    content: ""; position: absolute; left: 2px; top: 15px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--ink-soft); opacity: .6;
  }
  .brief-body p { margin: 6px 0; }
  .brief-body .greeting { color: var(--ink-soft); }
  .attention li {
    background: var(--amber-soft);
    border-radius: var(--radius-sm);
    padding: 9px 12px 9px 28px;
    margin-bottom: 6px;
  }
  .attention li::before { opacity: 1; background: var(--amber); left: 13px; top: 19px; width: 6px; height: 6px; }
  .attention.calm li { background: var(--glacier-soft); }
  .attention.calm li::before { background: var(--glacier); }
  .brief-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 24px 18px;
    border-top: 1px solid var(--line);
    font-size: 13px; color: var(--ink-soft);
  }
  .brief-error { color: var(--alert); }
  .skeleton { display: grid; gap: 10px; padding-top: 12px; }
  .skeleton span { height: 12px; border-radius: 6px; background: var(--glacier-soft); }
  .skeleton span:nth-child(2) { width: 80%; }
  .skeleton span:nth-child(3) { width: 65%; }
  .skeleton span:nth-child(5) { width: 70%; }

  .text-btn {
    background: none; border: 0; padding: 6px 8px; margin: -6px -8px;
    color: var(--glacier-strong); font-weight: 600; cursor: pointer; border-radius: var(--radius-btn);
  }
  .text-btn:hover { background: var(--glacier-soft); }
  .text-btn:disabled { opacity: .5; cursor: default; background: none; }
  .brief-toggle { display: none; }

  /* ---------- Chat ---------- */
  .chat { display: flex; flex-direction: column; min-height: 0; padding: 0 24px 24px; }
  .chat-head { display: flex; justify-content: flex-end; min-height: 22px; margin-bottom: 4px; }
  .chat-head .text-btn[hidden] { display: none; }
  #log {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
    padding: 8px 4px 20px;
  }
  .msg { max-width: 680px; }
  .msg.assistant { font-family: var(--font-body); font-size: 14.5px; line-height: 1.75; }
  .msg.user {
    align-self: flex-end;
    background: var(--glacier); color: #fff;
    padding: 10px 15px; border-radius: 14px 14px 3px 14px;
    white-space: pre-wrap; max-width: 75%;
  }
  @media (prefers-color-scheme: dark) { .msg.user { color: #2a0b19; } }
  .msg.assistant { align-self: flex-start; }
  .msg.assistant p { margin: 0 0 10px; }
  .msg.assistant p:last-child, .msg.assistant ul:last-child, .msg.assistant ol:last-child { margin-bottom: 0; }
  .msg.assistant ul, .msg.assistant ol { margin: 0 0 10px; padding-left: 20px; }
  .msg.assistant li { margin: 3px 0; }
  .msg.assistant strong { font-weight: 700; }
  .msg.assistant code { background: var(--glacier-soft); padding: 1px 5px; border-radius: 5px; font-size: 0.92em; }
  .msg.error {
    align-self: flex-start;
    background: var(--alert-soft); color: var(--alert);
    padding: 10px 14px; border-radius: var(--radius-sm);
  }
  .thinking { display: inline-flex; gap: 5px; padding: 8px 0; }
  .thinking span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--glacier);
    opacity: .35; animation: pulse 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: .15s; }
  .thinking span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 60%, 100% { opacity: .35; } 30% { opacity: 1; } }

  .empty { margin: auto 0; padding: 20px 4px; max-width: 560px; }
  .empty h2 { font-size: 24px; font-weight: 500; letter-spacing: .3px; margin: 0 0 6px; }
  .empty p { margin: 0 0 18px; color: var(--ink-soft); font-family: var(--font-body); font-size: 14px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggestions button {
    background: var(--surface); border: 1px solid var(--ink);
    padding: 8px 14px; border-radius: var(--radius-btn); cursor: pointer; color: var(--ink);
  }
  .suggestions button:hover { background: var(--glacier-soft); }

  form {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 8px 8px 8px 16px;
  }
  form:focus-within { border-color: var(--glacier); }
  textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent;
    padding: 8px 0; max-height: 160px; line-height: 1.5; font-family: var(--font-body); font-size: 14.5px;
  }
  textarea::placeholder { color: var(--ink-soft); }
  .send {
    background: var(--glacier); color: #fff; border: 0; cursor: pointer;
    padding: 10px 18px; border-radius: var(--radius-btn); font-weight: 500;
    text-transform: uppercase; letter-spacing: 2px; font-size: 12px;
  }
  @media (prefers-color-scheme: dark) { .send { color: #2a0b19; } }
  .send:disabled { opacity: .45; cursor: default; }

  /* ---------- Phone ---------- */
  @media (max-width: 860px) {
    .shell { display: flex; flex-direction: column; height: auto; min-height: 100vh; }
    .topbar { padding: 14px 16px; }
    .brand-sub { font-size: 14px; }
    .brief { margin: 0 16px 16px; }
    .brief-head { padding: 18px 18px 2px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .brief-date { font-size: 24px; }
    .brief-body { padding: 4px 18px 6px; overflow: visible; }
    .brief-foot { padding: 10px 18px 14px; }
    .brief-toggle { display: inline-block; margin-top: 4px; }
    .brief.collapsed .brief-body, .brief.collapsed .brief-foot { display: none; }
    .chat { padding: 0 16px 16px; flex: 1; }
    #log { overflow: visible; flex: none; }
    form { position: sticky; bottom: 12px; }
    .msg.user { max-width: 88%; }
  }

  /* ---------- Reports the assistant creates ---------- */
  .artifacts { display: grid; gap: 8px; margin-top: 14px; max-width: 540px; font-family: var(--font-head); }
  .artifact-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 12px 14px;
  }
  .artifact-ico { flex: none; width: 38px; height: 38px; border-radius: 8px; background: var(--glacier-soft); display: grid; place-items: center; }
  .artifact-ico svg { width: 20px; height: 20px; stroke: var(--glacier-strong); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .artifact-info { flex: 1; min-width: 0; }
  .artifact-title { font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artifact-sub { font-size: 13px; color: var(--ink-soft); }
  .artifact-actions { display: flex; align-items: center; gap: 10px; flex: none; }
  .btn-outline {
    background: var(--surface); color: var(--ink); border: 1px solid var(--ink); border-radius: var(--radius-btn);
    padding: 7px 14px; font-weight: 500; font-size: 13px; cursor: pointer;
  }
  .btn-outline:hover { background: var(--glacier-soft); }
  .viewer { position: fixed; inset: 0; z-index: 50; display: none; }
  .viewer.open { display: block; }
  .viewer-backdrop { position: absolute; inset: 0; background: rgba(27, 14, 21, .5); }
  .viewer-panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(980px, 100%);
    background: var(--frost); display: flex; flex-direction: column;
    box-shadow: -10px 0 40px rgba(0, 0, 0, .2);
  }
  .viewer-bar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .viewer-title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer iframe { flex: 1; width: 100%; border: 0; background: var(--frost); }
  .working-note { font-size: 13px; color: var(--ink-soft); margin: 0 0 0 10px; }
  @media (max-width: 860px) {
    .artifact-card { flex-wrap: wrap; }
    .artifact-actions { width: 100%; justify-content: flex-end; }
    .viewer-bar { gap: 8px; padding: 8px 12px; }
    .viewer-bar .hide-narrow { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .thinking span { animation: none; opacity: .7; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" id="brandLogo" alt="HerVpod"
           src="https://hervpod.com/cdn/shop/files/Vpod_Logo_pink_e56965a8-7937-494e-8a2f-dd898bf5a70e.png?width=240">
      <span class="brand-name" id="brandName" hidden>Cool Comforts Co</span>
      <span class="brand-sub">Genesis AI</span>
    </div>
    <div class="top-actions">
      <span class="test-mode" id="testMode" hidden>Test mode: replies are placeholders</span>
      <a class="text-btn" id="signOut" href="/logout" hidden>Sign out</a>
    </div>
  </header>

  <aside class="brief" id="brief" aria-label="Morning brief">
    <div class="brief-head">
      <div>
        <p class="brief-kicker" id="briefKicker">Morning brief</p>
        <h1 class="brief-date" id="briefDate"></h1>
      </div>
      <button type="button" class="text-btn brief-toggle" id="briefToggle" aria-expanded="true">Hide</button>
    </div>
    <div class="brief-body" id="briefBody">
      <div class="skeleton" aria-label="Loading brief"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="brief-foot">
      <span id="briefMeta">Putting together yesterday's numbers</span>
      <button type="button" class="text-btn" id="briefRefresh">Refresh</button>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-head"><button type="button" class="text-btn" id="newChat" hidden>New chat</button></div>
    <div id="log" aria-live="polite">
      <div class="empty" id="empty">
        <h2>What do you want to know?</h2>
        <p>Ask about sales, products or the website, in your own words.</p>
        <div class="suggestions">
          <button type="button">How were sales yesterday?</button>
          <button type="button">How did this week compare to last week?</button>
          <button type="button">What should we improve on the website?</button>
          <button type="button">Make a report of this week's sales and traffic</button>
        </div>
      </div>
    </div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Ask about the business" aria-label="Message"></textarea>
      <button class="send" id="send">Send</button>
    </form>
  </main>
</div>


<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="viewer-backdrop" id="viewerBackdrop"></div>
  <div class="viewer-panel">
    <div class="viewer-bar">
      <span class="viewer-title" id="viewerTitle"></span>
      <a class="text-btn hide-narrow" id="viewerTab" target="_blank" rel="noopener">Open in new tab</a>
      <a class="text-btn" id="viewerDownload">Download</a>
      <button type="button" class="text-btn" id="viewerClose">Close</button>
    </div>
    <iframe id="viewerFrame" title="Report" sandbox="" referrerpolicy="no-referrer"></iframe>
  </div>
</div>
<script>
  // ---------- Tiny, safe markdown renderer (bold, code, bullet + numbered lists, paragraphs)
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function inline(s) {
    return escapeHtml(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  function renderMarkdown(text) {
    const out = [];
    let list = null, para = [];
    const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
    const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      const bullet = line.match(/^([-*•])\s+(.*)$/);
      const numbered = line.match(/^\d+[.)]\s+(.*)$/);
      const heading = line.match(/^#{1,6}\s+(.*)$/);
      if (!line) { flushPara(); closeList(); continue; }
      if (bullet || numbered) {
        flushPara();
        const type = bullet ? "ul" : "ol";
        if (list !== type) { closeList(); out.push(`<${type}>`); list = type; }
        out.push(`<li>${inline(bullet ? bullet[2] : numbered[1])}</li>`);
        continue;
      }
      closeList();
      if (heading) { flushPara(); out.push(`<p><strong>${inline(heading[1])}</strong></p>`); continue; }
      para.push(line);
    }
    flushPara(); closeList();
    return out.join("");
  }

  // ---------- Logo falls back to text if offline
  (function () {
    const logo = document.getElementById("brandLogo");
    const fallback = () => { logo.remove(); document.getElementById("brandName").hidden = false; };
    if (logo.complete && logo.naturalWidth === 0) fallback();
    else logo.addEventListener("error", fallback);
  })();

  // ---------- Status
  fetch("/health").then(r => { if (r.status === 401) location.replace("/login"); return r.json(); }).then(d => {
    document.getElementById("testMode").hidden = d.mode === "anthropic";
    document.getElementById("signOut").hidden = !d.login;
  }).catch(() => {
    const el = document.getElementById("testMode");
    el.textContent = "Server not reachable. Start uvicorn and reload.";
    el.hidden = false;
  });

  // ---------- Morning brief
  const briefEl = document.getElementById("brief");
  const briefBody = document.getElementById("briefBody");
  const briefMeta = document.getElementById("briefMeta");
  const briefDate = document.getElementById("briefDate");
  const briefKicker = document.getElementById("briefKicker");
  const briefRefresh = document.getElementById("briefRefresh");
  const briefToggle = document.getElementById("briefToggle");

  briefDate.textContent = new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });

  const SECTION = /^(?:#+\s*)?([A-Z][A-Z &/]+?)(\s*\([^)]*\))?:?$/;
  function sentenceCase(s) { s = s.trim().toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }

  // Turn the brief's plain text (SALES / WEBSITE / NEEDS ATTENTION + bullets) into sections.
  function renderBrief(text) {
    const html = [];
    let open = null;
    const close = () => { if (open) { html.push("</ul>"); open = null; } };
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      if (!line) continue;
      const sec = line.match(SECTION);
      const bullet = line.match(/^[-*•]\s+(.*)$/);
      if (sec && line.length < 40) {
        close();
        const name = sentenceCase(sec[1]) + (sec[2] ? sec[2].replace(/\(\s*/, " (") : "");
        const attention = /attention/i.test(sec[1]);
        html.push(`<h3>${escapeHtml(name)}</h3><ul class="${attention ? "attention" : ""}">`);
        open = attention ? "attention" : "list";
      } else if (bullet) {
        if (!open) { html.push("<ul>"); open = "list"; }
        html.push(`<li>${inline(bullet[1])}</li>`);
      } else if (/^good morning/i.test(line)) {
        close(); // greeting repeats the date heading; keep it short and quiet
        let g = line.replace(/^good morning[,!]?\s*[—–-]?\s*/i, "");
        g = g.charAt(0).toUpperCase() + g.slice(1);
        if (g) html.push(`<p class="greeting">${inline(g)}</p>`);
      } else {
        close();
        html.push(`<p>${inline(line)}</p>`);
      }
    }
    close();
    return html.join("");
  }

  async function loadBrief(refresh = false) {
    briefRefresh.disabled = true;
    briefMeta.classList.remove("brief-error");
    briefMeta.textContent = refresh ? "Rebuilding the brief" : "Putting together yesterday's numbers";
    if (refresh) briefBody.innerHTML = '<div class="skeleton"><span></span><span></span><span></span><span></span><span></span></div>';
    try {
      const res = await fetch(`/api/brief${refresh ? "?refresh=true" : ""}`);
      if (res.status === 401) return location.replace("/login");
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
      briefBody.innerHTML = renderBrief(data.brief);
      const att = briefBody.querySelector(".attention");
      if (att && /nothing unusual/i.test(att.textContent)) att.classList.add("calm");
      const n = data.flags.length + data.errors.length;
      briefKicker.textContent = n ? `Morning brief, ${n} ${n === 1 ? "thing" : "things"} to check` : "Morning brief";
      const t = data.generated_at ? new Date(data.generated_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
      briefMeta.textContent = t ? `Updated ${t}` : "";
    } catch (err) {
      briefBody.innerHTML = "";
      briefMeta.textContent = `Couldn't load the brief: ${err.message}`;
      briefMeta.classList.add("brief-error");
    } finally {
      briefRefresh.disabled = false;
    }
  }
  briefRefresh.addEventListener("click", () => loadBrief(true));
  briefToggle.addEventListener("click", () => {
    const collapsed = briefEl.classList.toggle("collapsed");
    briefToggle.textContent = collapsed ? "Show" : "Hide";
    briefToggle.setAttribute("aria-expanded", String(!collapsed));
  });
  loadBrief();

  // ---------- Reports (artifacts) created by the assistant
  const viewer = document.getElementById("viewer");
  const viewerFrame = document.getElementById("viewerFrame");
  let viewerOpener = null;

  function openViewer(art, opener) {
    document.getElementById("viewerTitle").textContent = art.title;
    document.getElementById("viewerTab").href = art.url;
    const dl = document.getElementById("viewerDownload");
    dl.href = `${art.url}?download=true`;
    dl.setAttribute("download", art.filename || "report.html");
    viewerFrame.src = art.url;
    viewer.classList.add("open");
    document.body.style.overflow = "hidden";
    viewerOpener = opener;
    document.getElementById("viewerClose").focus();
  }
  function closeViewer() {
    viewer.classList.remove("open");
    viewerFrame.src = "about:blank";
    document.body.style.overflow = "";
    if (viewerOpener) viewerOpener.focus();
  }
  document.getElementById("viewerClose").addEventListener("click", closeViewer);
  document.getElementById("viewerBackdrop").addEventListener("click", closeViewer);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && viewer.classList.contains("open")) closeViewer(); });

  function artifactCards(list) {
    const wrap = document.createElement("div");
    wrap.className = "artifacts";
    for (const art of list) {
      const card = document.createElement("div");
      card.className = "artifact-card";
      card.innerHTML = '<div class="artifact-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 17v-3M12 17v-6M15 17v-4"/></svg></div>';
      const info = document.createElement("div");
      info.className = "artifact-info";
      const t = document.createElement("div"); t.className = "artifact-title"; t.textContent = art.title;
      const sub = document.createElement("div"); sub.className = "artifact-sub"; sub.textContent = "Report";
      info.append(t, sub);
      const actions = document.createElement("div");
      actions.className = "artifact-actions";
      const view = document.createElement("button");
      view.type = "button"; view.className = "btn-outline"; view.textContent = "View report";
      view.addEventListener("click", () => openViewer(art, view));
      const dl = document.createElement("a");
      dl.className = "text-btn"; dl.textContent = "Download";
      dl.href = `${art.url}?download=true`; dl.setAttribute("download", art.filename || "report.html");
      actions.append(view, dl);
      card.append(info, actions);
      wrap.appendChild(card);
    }
    return wrap;
  }

  // ---------- Chat
  let history = [];
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const newChat = document.getElementById("newChat");
  const emptyTemplate = document.getElementById("empty").cloneNode(true);

  function addMessage(role, text) {
    document.getElementById("empty")?.remove();
    newChat.hidden = false;
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    if (role === "assistant") el.innerHTML = renderMarkdown(text);
    else el.textContent = text;
    log.appendChild(el);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
    return el;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autoGrow);

  async function ask(text) {
    text = text.trim();
    if (!text || send.disabled) return;
    input.value = ""; autoGrow();
    history.push({ role: "user", content: text });
    addMessage("user", text);
    send.disabled = true;
    const pending = addMessage("assistant", "");
    pending.innerHTML = '<div class="thinking" aria-label="Working"><span></span><span></span><span></span></div>';
    const slow = setTimeout(() => {
      if (pending.querySelector(".thinking")) {
        const note = document.createElement("span");
        note.className = "working-note";
        note.textContent = "Still working. Reports take a little longer.";
        pending.firstChild.after(note);
      }
    }, 9000);
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      if (res.status === 401) return location.replace("/login");
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
      pending.innerHTML = renderMarkdown(data.reply);
      if (data.artifacts && data.artifacts.length) pending.appendChild(artifactCards(data.artifacts));
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      history.pop();
      pending.className = "msg error";
      pending.textContent = err.message;
    } finally {
      clearTimeout(slow);
      send.disabled = false;
      input.focus();
    }
  }

  function wireSuggestions(root) {
    root.querySelectorAll(".suggestions button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
  }
  wireSuggestions(document);

  newChat.addEventListener("click", () => {
    history = [];
    log.innerHTML = "";
    const fresh = emptyTemplate.cloneNode(true);
    log.appendChild(fresh);
    wireSuggestions(fresh);
    newChat.hidden = true;
    input.focus();
  });

  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
</script>
</body>
</html>
